<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inkpost · frame ideas</title>
<!--
	Frame ideas for the Inkpost frame, drawn the way the panel shows them: 800 × 480, black and white
	only (D4), text in the editor's font and sizes (D22). Open the file in a browser; it needs no server.

	Every frame is drawn on a canvas, then every pixel is turned to pure black or white (50 %), so what
	you see is what the frame would show. The dog is Luli, a brown dachshund, with her halo. In the
	message frames she and the small props are pixel art: grids of letters (see SPRITES), drawn at a
	whole number of pixels per cell, with a 1-cell outline added around them. The Luli frames draw her
	from curves instead (see LULI): a cartoon with flat tones in dots, the style chosen for her.
-->
<style>
	:root {
		--ink: #1f1d1a;
		--muted: #6b665e;
		--bg: #f3f0ea;
		--line: #ddd7cc;
		--wood: #2a2622;
		--tap: 2.75rem;
		font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
		color: var(--ink);
		background: var(--bg);
	}
	* { box-sizing: border-box; }
	body { margin: 0; }
	header, .controls, .filters, main { max-width: 96rem; margin: 0 auto; padding-inline: 1rem; }
	header { padding-top: 1.5rem; }
	h1 { margin: 0 0 .35rem; font-size: 1.6rem; }
	header p { margin: .25rem 0; color: var(--muted); max-width: 52rem; line-height: 1.45; }
	.controls { display: flex; flex-wrap: wrap; gap: .75rem 1.25rem; align-items: end; margin-top: 1.25rem; }
	.controls label { display: grid; gap: .25rem; font-size: .85rem; color: var(--muted); }
	.controls input[type=text], .controls select {
		font: inherit; font-size: 1rem; min-height: var(--tap); padding: 0 .6rem; color: var(--ink);
		border: 1px solid var(--line); border-radius: .4rem; background: #fff;
	}
	.controls label.check { display: flex; align-items: center; gap: .45rem; min-height: var(--tap); font-size: 1rem; color: var(--ink); }
	.controls input[type=checkbox] { width: 1.2rem; height: 1.2rem; }
	.filters { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: 1rem; }
	.filters button {
		font: inherit; min-height: var(--tap); padding: 0 1rem; cursor: pointer; color: var(--ink);
		border: 1px solid var(--line); border-radius: 999px; background: #fff;
	}
	.filters button[aria-pressed=true] { background: var(--ink); border-color: var(--ink); color: #fff; }
	main {
		display: grid; gap: 1.5rem; padding-block: 1.25rem 3rem;
		grid-template-columns: repeat(auto-fill, minmax(min(100%, 25rem), 1fr));
	}
	body.actual main { grid-template-columns: 1fr; justify-items: start; overflow-x: auto; }
	.card { display: flex; flex-direction: column; background: #fff; border: 1px solid var(--line); border-radius: .75rem; overflow: hidden; }
	.card[hidden] { display: none; }
	/* The picture frame around the panel. */
	.frame { padding: 1rem; background: var(--wood); }
	.frame canvas { display: block; width: 100%; height: auto; cursor: zoom-in; }
	body.actual .frame canvas { width: 800px; image-rendering: pixelated; }
	/* E-paper isn't paper white or ink black. */
	body.paper canvas { filter: contrast(.8) brightness(.94) sepia(.12); }
	.info { display: grid; gap: .3rem; padding: .75rem 1rem 1rem; }
	.info h2 { margin: 0; font-size: 1rem; }
	.info .when { font-size: .875rem; color: var(--muted); }
	.info .when.code { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: .8rem; overflow-wrap: anywhere; }
	.info .text { font-size: .875rem; font-style: italic; }
	.info button {
		justify-self: start; margin-top: .35rem; min-height: var(--tap); padding: 0 1rem; cursor: pointer;
		font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: .4rem;
	}
	dialog { padding: 1.25rem; border: 0; background: var(--wood); max-width: 98vw; max-height: 98vh; }
	dialog::backdrop { background: rgb(0 0 0 / .75); }
	dialog canvas { display: block; width: min(92vw, calc(88vh * 800 / 480)); image-rendering: pixelated; cursor: zoom-out; }
	@media (min-width: 40rem) {
		header, .controls, .filters, main { padding-inline: 2rem; }
	}
</style>
</head>
<body>
<header>
	<h1>Frame ideas</h1>
	<p>Ideas for the frame: 800 × 480, black and white only, in the editor's font and sizes. Download a
		PNG and add it in the editor as a photo with <strong>50% threshold</strong>: it comes out pixel for
		pixel, and you can still add text or draw over it.</p>
	<p>Click a frame to see it bigger.</p>
</header>

<form class="controls" id="controls">
	<label>Her name (or how you call her)
		<input type="text" id="her" value="meu amor" autocomplete="off">
	</label>
	<label class="check"><input type="checkbox" id="halo" checked> Halo</label>
	<label class="check"><input type="checkbox" id="paper"> E-paper tint</label>
	<label class="check"><input type="checkbox" id="actual"> Actual pixels (1×)</label>
</form>

<nav class="filters" id="filters" aria-label="Kinds of frame"></nav>

<main id="grid"></main>

<template id="card-template">
	<article class="card">
		<div class="frame"><canvas width="800" height="480"></canvas></div>
		<div class="info">
			<h2></h2>
			<span class="when"></span>
			<button type="button">Download PNG</button>
		</div>
	</article>
</template>

<dialog id="zoom"><canvas width="800" height="480"></canvas></dialog>

<script>
"use strict";

const W = 800;
const H = 480;
const FONT = '"Inkpost Text"';
const BLACK = "#000";
const WHITE = "#fff";

// ---------------------------------------------------------------------------------------------------------
// Sprites. One letter per cell:
//   .  nothing          o  coat (or white, for props)   e  ear (the coat's darker part)
//   n  black            w  white                         #  a black line inside

// Every other cell next to o, e, n, w, #, d or l becomes the outline. Rows may be shorter than the
// widest one: they're padded with "." on the right.
// ---------------------------------------------------------------------------------------------------------

const GLASS = [

	"nnnnnnnnnnnnnnnnn",

// The star on top is drawn by the frame.
const TREE = [

	".......ddd",
	"......ddwdd",
	".....ddddddd",
	"......ddddd",
	".....dwddddd",
	"....ddddddwdd",
	".....ddddddd",

	"...dddddddwddd",
	"..ddddddddddddd",
	".dwddddddddddwdd",

const GIFT = [

	".....h",
	"ooooonooooo",
	"ooooonooooo",
	"nnnnnnnnnnn",
	"ooooonooooo",

	"ooooonooooo",

	"hddddh",

	"hhhhhh",

// ---------------------------------------------------------------------------------------------------------
// Words wrapped to a width, as the editor does it (text.js).
// ---------------------------------------------------------------------------------------------------------

function wrap(text, width, measure) {
	const lines = [];
	for (const paragraph of text.split("\n")) {
		let line = null;
		for (const word of paragraph.split(" ")) {
			const longer = line === null ? word : `${line} ${word}`;
			if (line === null || measure(longer) <= width) {
				line = longer;
			} else {
				lines.push(line);
				line = word;
			}
		}
		lines.push(line);
	}
	return lines;
}

// ---------------------------------------------------------------------------------------------------------
// Cells: layers of sprites put together, outlined, and drawn.
// ---------------------------------------------------------------------------------------------------------

const SOLID = new Set("oenw#dl");

/** Layers ({ rows, x, y }) on one grid, the later ones over the earlier ones, with a free cell all around. */
function compose(layers) {
	let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
	for (const { rows, x = 0, y = 0 } of layers) {
		minX = Math.min(minX, x);
		minY = Math.min(minY, y);
		maxX = Math.max(maxX, x + Math.max(...rows.map((row) => row.length)));
		maxY = Math.max(maxY, y + rows.length);
	}
	const cells = Array.from({ length: maxY - minY + 2 }, () => Array(maxX - minX + 2).fill("."));
	for (const { rows, x = 0, y = 0 } of layers) {
		rows.forEach((row, rowIndex) => {
			[...row].forEach((cell, column) => {
				if (cell !== ".") {
					cells[rowIndex + y - minY + 1][column + x - minX + 1] = cell;
				}
			});
		});
	}
	return cells;
}

function neighbours(cells, x, y) {
	return [cells[y - 1]?.[x], cells[y + 1]?.[x], cells[y][x - 1], cells[y][x + 1]];
}

/** The outline around everything solid. */
function outline(cells) {
	const lined = cells.map((row) => [...row]);
	cells.forEach((row, y) => {
		row.forEach((cell, x) => {
			if (cell === "." && neighbours(cells, x, y).some((other) => SOLID.has(other))) {
				lined[y][x] = "L";
			}
		});
	});
	return lined;
}

function mirror(cells) {
	return cells.map((row) => [...row].reverse());
}

// ---------------------------------------------------------------------------------------------------------
// Luli: a cartoon with flat tones in dots, in poses. Put her in a frame with p.luli(pose, options):
//
//   p.luli("peek")                                   peeking over the bottom edge, in the middle
//   p.luli("peek", { x: 690, scale: 0.5 })           smaller, in the bottom-right corner
//   p.luli("side", { x: W, y: 240, flip: true })     peeking in from the right edge
//   p.luli("trotting", { holding: "letter" })        trotting along the bottom with a letter
//
// Where (x, y) puts each pose (LULI_POSES), and where she is without them:
//   peek, headTop, chin             the middle of the edge she's behind: the bottom edge's middle
//   upsideDown                      the middle of the edge she hangs from: the top edge's middle
//   side                            where she comes in on the left edge: halfway down
//   standing, sausage, sitting,     side-on, facing right: the ground under her, the bottom edge's middle
//   asleep, trotting
// Options:
//   scale     her size (1: about 330 px tall peeking)
//   flip      mirrored, e.g. to come in from the right edge, or face left
//   eyes      "open", "happy" ◠, "closed" ◡, "sleepy", "wink" or "puppy"
//   mouth     "smile", "tongue" or "o"
//   over      peek only: what she peeks over, "heart", "sign" (blank, for a message) or "gift"
//   holding   in her mouth, side-on poses: "heart" or "letter"
//   night     a white outline, for black backgrounds
//   halo      follows the page's checkbox unless given
// Each pose has its own eyes and mouth unless they're given.
//
// She's drawn on two layers, as parts in front of each other: the tones (her coat is brown, with a darker
// crown, ears and stripe down her back, a grey muzzle and eyebrows) become even dot patterns (a 4 × 4
// Bayer matrix), and her lines, eyes and nose go over them in pure black and white. Each pose draws in its
// own coordinates from the point (x, y) puts on the frame, y getting more negative going up.
// ---------------------------------------------------------------------------------------------------------

const LULI_LINE = 6;
// Her tones, 0 black … 1 white.
const COAT = 0.52;
const HEAD = 0.56;
const DARK = 0.4; // her crown, ears, the stripe down her back, and the legs further away
const MUZZLE = 0.86; // her grey muzzle and eyebrows
const PAW = 0.64;
const TONGUE = 0.92;
const SIDES = [-1, 1];

function pathOf(build) {
	const path = new Path2D();
	build(path);
	return path;
}

function ellipsePath(x, y, rx, ry, rotation = 0) {
	return pathOf((path) => path.ellipse(x, y, rx, ry, rotation, 0, Math.PI * 2));
}

function rectPath(x, y, width, height, radius = 0) {
	return pathOf((path) => path.roundRect(x, y, width, height, radius));
}

function heartPath(x, y, width) {
	const s = width / 2;
	return pathOf((path) => {
		path.moveTo(x, y + s * 0.85);
		path.bezierCurveTo(x - s * 0.55, y + s * 0.4, x - s * 1.05, y + s * 0.05, x - s, y - s * 0.35);
		path.bezierCurveTo(x - s * 0.95, y - s * 0.95, x - s * 0.2, y - s * 1.05, x, y - s * 0.45);
		path.bezierCurveTo(x + s * 0.2, y - s * 1.05, x + s * 0.95, y - s * 0.95, x + s, y - s * 0.35);
		path.bezierCurveTo(x + s * 1.05, y + s * 0.05, x + s * 0.55, y + s * 0.4, x, y + s * 0.85);
		path.closePath();
	});
}

function grayOf(tone) {
	const value = Math.round(tone * 255);
	return `rgb(${value} ${value} ${value})`;
}

/**
 * What Luli and the decorations draw with, on both layers: parts in front of each other, lines and solid
 * shapes. Outlines are `lineWidth` wide, in `lineColor`.
 */
function luliKit(tones, ink, lineColor, lineWidth = LULI_LINE) {
	const both = (draw) => {
		draw(tones);
		draw(ink);
	};
	const kit = {
		lineColor,
		lineWidth,
		/**
		 * A part filled with a tone, in front of what's drawn so far (it covers the lines behind it), and
		 * outlined: `line` is true, false, or a y to outline it only below that.
		 */
		part(path, tone, line = true, color = lineColor) {
			tones.fillStyle = grayOf(tone);
			tones.fill(path);
			ink.globalCompositeOperation = "destination-out";
			ink.fill(path);
			ink.globalCompositeOperation = "source-over";
			if (line === true) {
				kit.stroke(path, lineWidth, color);
			} else if (line !== false) {
				kit.below(line, () => kit.stroke(path, lineWidth, color));
			}
		},
		/**
		 * A limb (or several as one shape: see limbPath), like a part: in front of what's drawn so far, its
		 * outline just outside it (`line` true, false, or a y to outline it only below that).
		 */
		limb(limbs, tone, line = true, color = lineColor) {
			const shape = limbPath(limbs);
			tones.fillStyle = grayOf(tone);
			tones.fill(shape);
			const outline = () => {
				ink.fillStyle = color;
				ink.fill(limbPath(limbs, lineWidth * 0.8));
			};
			if (line === true) {
				outline();
			} else if (line !== false) {
				kit.below(line, outline);
			}
			ink.globalCompositeOperation = "destination-out";
			ink.fill(shape);
			ink.globalCompositeOperation = "source-over";
		},
		stroke(path, width = lineWidth, color = lineColor) {
			ink.lineWidth = width;
			ink.strokeStyle = color;
			ink.stroke(path);
		},
		dashed(path, width = lineWidth, dash = [14, 10], color = lineColor) {
			ink.setLineDash(dash);
			kit.stroke(path, width, color);
			ink.setLineDash([]);
		},
		solid(path, color = BLACK) {
			ink.fillStyle = color;
			ink.fill(path);
		},
		/** Draws with `draw` moved to (x, y), turned `angle` radians clockwise, and mirrored if `flip`. */
		at(x, y, angle, draw, flip = false) {
			both((g) => {
				g.save();
				g.translate(x, y);
				g.rotate(angle);
				if (flip) g.scale(-1, 1);
			});
			draw();
			both((g) => g.restore());
		},
		/** Draws with `draw` turned `angle` radians clockwise around (x, y). */
		around(x, y, angle, draw) {
			kit.at(x, y, angle, () => kit.at(-x, -y, 0, draw));
		},
		/** Draws with `draw` only inside `area`. */
		inside(area, draw) {
			both((g) => {
				g.save();
				g.clip(area);
			});
			draw();
			both((g) => g.restore());
		},
		above(y, draw) {
			kit.inside(rectPath(-4000, y - 8000, 8000, 8000), draw);
		},
		below(y, draw) {
			kit.inside(rectPath(-4000, y, 8000, 8000), draw);
		},
		rightOf(x, draw) {
			kit.inside(rectPath(x, -4000, 8000, 8000), draw);
		},
	};
	return kit;
}

/** Adds a circle to a path as a shape of its own. */
function addCircle(path, x, y, r) {
	path.moveTo(x + r, y);
	path.arc(x, y, r, 0, Math.PI * 2);
}

/** An eye at (x, y): "open", "puppy" (bigger and shinier), "happy" ◠, "closed" ◡ or "sleepy" (half shut). */
function drawEye(kit, x, y, kind, size = 1) {
	if (kind === "open" || kind === "puppy") {
		const s = kind === "puppy" ? size * 1.2 : size;
		kit.solid(ellipsePath(x, y, 15 * s, 18 * s));
		kit.solid(pathOf((path) => {
			addCircle(path, x + 5 * s, y - 8 * s, (kind === "puppy" ? 6.5 : 5.5) * s);
			addCircle(path, x - 5 * s, y + 8 * s, 2.5 * s);
		}), WHITE);
	} else if (kind === "sleepy") {
		kit.below(y - 2 * size, () => kit.solid(ellipsePath(x, y, 15 * size, 18 * size)));
		kit.stroke(pathOf((path) => {
			path.moveTo(x - 17 * size, y - 2 * size);
			path.lineTo(x + 17 * size, y - 2 * size);
		}), 5 * size, BLACK);
	} else {
		const bend = kind === "happy" ? -1 : 1;
		kit.stroke(pathOf((path) => {
			path.moveTo(x - 14 * size, y - 4 * size * bend);
			path.quadraticCurveTo(x, y + 16 * size * bend, x + 14 * size, y - 4 * size * bend);
		}), 5 * size, BLACK);
	}
}

// Her head from the front, its middle at the origin.
const FRONT = (() => {
	/** An ear hanging from the top of the head; `side` is −1 for the one on the left. */
	const ear = (side) => pathOf((path) => {
		const at = (x, y) => [-x * side, y];
		path.moveTo(...at(-52, -81));
		path.bezierCurveTo(...at(-95, -95), ...at(-128, -60), ...at(-128, -5));
		path.bezierCurveTo(...at(-128, 55), ...at(-126, 110), ...at(-100, 127));
		path.bezierCurveTo(...at(-84, 135), ...at(-76, 105), ...at(-78, 65));
		path.bezierCurveTo(...at(-80, 15), ...at(-82, -45), ...at(-52, -81));
		path.closePath();
	});
	// Ears flopped the other way, over the top of her head, when she hangs upside down.
	const flop = new DOMMatrix().translate(0, -75).scale(1, -0.7).translate(0, 75);
	return {
		head: ellipsePath(0, 0, 105, 92),
		ears: SIDES.map((side) => ({ side, down: ear(side), up: pathOf((path) => path.addPath(ear(side), flop)), attach: [52 * side, -81] })),
		// The darker stripe on top of her head (it ran down her back too).
		crown: ellipsePath(0, -73, 52, 26),
		muzzle: pathOf((path) => {
			path.moveTo(-44, 10);
			path.quadraticCurveTo(0, -30, 44, 10);
			path.bezierCurveTo(58, 50, 50, 105, 34, 135);
			path.quadraticCurveTo(0, 165, -34, 135);
			path.bezierCurveTo(-50, 105, -58, 50, -44, 10);
			path.closePath();
		}),
		brows: SIDES.map((side) => ellipsePath(50 * side, -49, 13, 8)),
		nose: pathOf((path) => {
			path.moveTo(-30, 93);
			path.quadraticCurveTo(0, 85, 30, 93);
			path.bezierCurveTo(46, 99, 40, 123, 18, 128);

/** Her head from the front. `ears`: "down", "splayed" (lying flat out to the sides) or "up". */
function drawFrontHead(kit, { eyes = "open", mouth = "smile", ears = "down", halo = true, haloAt = [0, -127, 80] }) {
	if (ears === "up") {
		for (const ear of FRONT.ears) kit.part(ear.up, DARK);
	}
	kit.part(FRONT.head, HEAD);
	kit.inside(FRONT.head, () => kit.part(FRONT.crown, DARK, false));
	if (ears !== "up") {
		for (const ear of FRONT.ears) {
			kit.around(...ear.attach, ears === "splayed" ? -ear.side * 0.28 : 0, () => kit.part(ear.down, DARK));
		}
	}
	kit.part(FRONT.muzzle, MUZZLE, 70);
	for (const brow of FRONT.brows) kit.part(brow, MUZZLE, false);
	for (const side of SIDES) {
		drawEye(kit, 52 * side, -10, eyes === "wink" ? (side < 0 ? "open" : "happy") : eyes);
	}
	kit.solid(FRONT.nose);
	kit.solid(FRONT.noseShine, WHITE);
	if (mouth === "tongue") kit.part(FRONT.tongue, TONGUE, true, BLACK);
	kit.stroke(pathOf((path) => {
		path.moveTo(0, 129);
		path.lineTo(0, mouth === "o" ? 135 : 141);
		if (mouth !== "o") {
			path.moveTo(-20, 145);
			path.quadraticCurveTo(-8, 149, 0, 141);
			path.quadraticCurveTo(8, 149, 20, 145);
		}
		if (mouth === "tongue") {
			path.moveTo(0, 147);
			path.lineTo(0, 154);
		}
	}), 3.6, BLACK);
	if (mouth === "o") kit.solid(ellipsePath(0, 146, 8, 10));
	if (halo) {
		const [x, y, rx] = haloAt;
		kit.stroke(ellipsePath(x, y, rx, rx * 0.21), LULI_LINE * 1.5);
	}
}

/** What she peeks over, its top edge along y = 0 under her paws. */
function drawProp(kit, kind) {
	if (kind === "heart") {
		kit.part(heartPath(0, 100, 400), 0.3);
	} else if (kind === "sign") {
		kit.part(rectPath(-220, -24, 440, 210, 16), 1);

	} else if (kind === "gift") {

		kit.part(box, MUZZLE);

// Side-on, she's made of limbs: smooth tubes along curves through joints, each joint with its own
// thickness ([x, y, radius]), so her outline is one flowing line, like a drawing. A pose is just where her
// joints are (SIDE_RIGS), facing right, on the ground at y = 0.

function catmullRom(a, b, c, d, t) {
	return 0.5 * (2 * b + (c - a) * t + (2 * a - 5 * b + 4 * c - d) * t * t + (3 * b - a - 3 * c + d) * t * t * t);
}

/** Points [x, y, radius] along a smooth curve through the joints, about every 2 px. */
function alongJoints(joints) {
	const points = [];
	for (let i = 0; i < joints.length - 1; i++) {
		const [a, b, c, d] = [joints[Math.max(i - 1, 0)], joints[i], joints[i + 1], joints[Math.min(i + 2, joints.length - 1)]];
		const steps = Math.max(1, Math.ceil(Math.hypot(c[0] - b[0], c[1] - b[1]) / 2));
		for (let step = 0; step < steps; step++) {
			points.push([0, 1, 2].map((k) => catmullRom(a[k], b[k], c[k], d[k], step / steps)));
		}
	}
	points.push(joints.at(-1));
	return points;
}

/** The shape of one limb (a list of joints), or of several as one, `grow` px fatter all round. */
function limbPath(limbs, grow = 0) {
	const all = typeof limbs[0][0] === "number" ? [limbs] : limbs;
	return pathOf((path) => {
		for (const joints of all) {
			for (const [x, y, r] of alongJoints(joints)) addCircle(path, x, y, Math.max(0.5, r + grow));
		}
	});
}

/** Her body side-on, from a rig (SIDE_RIGS). */
function drawSideBody(kit, rig, look) {
	if (rig.tail) kit.limb(rig.tail, COAT);
	for (const leg of rig.far) kit.limb(leg, DARK);
	kit.limb(rig.body, COAT);
	kit.inside(limbPath(rig.body), () => kit.limb(rig.stripe, DARK, false));
	// A near leg's outline starts halfway down its top joint, so it reads as the curve of a thigh or a
	// shoulder on her side, not as a circle stuck on.
	for (const leg of rig.near) kit.limb(leg, COAT, leg[0][1]);
	for (const limb of rig.front ?? []) kit.limb(limb, COAT);
	const [x, y, angle] = rig.head;
	kit.at(x, y, angle, () => drawSideHead(kit, { ...rig.look, ...look }));
}

/** A side-on pose, on the ground under her middle. */
function sidePose(name) {
	const rig = SIDE_RIGS[name];
	return { anchor: [W / 2, H], draw: (kit, look) => kit.at(-(rig.middle ?? 0), 0, 0, () => drawSideBody(kit, rig, look)) };
}

const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];

/**
 * A layer made pure black and white where it's drawn (at least half opaque), see-through elsewhere: by a
 * 4 × 4 Bayer matrix (even dot patterns), or at 50 %.
 */
function oneBitLayer(canvas, method) {
	const { width, height } = canvas;
	const image = canvas.getContext("2d").getImageData(0, 0, width, height);
	const data = image.data;
	for (let y = 0; y < height; y++) {
		for (let x = 0; x < width; x++) {
			const i = (y * width + x) * 4;
			if (data[i + 3] < 128) {
				data[i + 3] = 0;
				continue;
			}
			const tone = (data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114) / 255;
			const white = method === "bayer" ? tone > (BAYER[(y % 4) * 4 + (x % 4)] + 0.5) / 16 : tone >= 0.5;
			data[i] = data[i + 1] = data[i + 2] = white ? 255 : 0;
			data[i + 3] = 255;
		}
	}
	const result = document.createElement("canvas");
	result.width = width;
	result.height = height;
	result.getContext("2d").putImageData(image, 0, 0);
	return result;
}

/** Luli in a pose (see above), on a frame-sized canvas that's see-through around her. */
function drawLuli(pose, { x, y, scale = 1, flip = false, night = false, ...look }) {
	const { anchor, draw } = LULI_POSES[pose];
	// Options left out keep the pose's own.
	const given = Object.fromEntries(Object.entries(look).filter(([, value]) => value !== undefined));
	return renderKit((kit) => draw(kit, given), { x: x ?? anchor[0], y: y ?? anchor[1], scale, flip, night });
}

/**
 * What `draw` draws with a kit (see luliKit), its origin at (x, y), as a frame-sized canvas that's
 * see-through around the drawing: the tones in dots, the lines over them.
 */
function renderKit(draw, { x = 0, y = 0, scale = 1, flip = false, night = false, lineWidth = LULI_LINE } = {}) {
	const layer = () => {
		const canvas = document.createElement("canvas");
		canvas.width = W;
		canvas.height = H;
		const g = canvas.getContext("2d", { willReadFrequently: true });
		g.setTransform(flip ? -scale : scale, 0, 0, scale, x, y);
		g.lineJoin = "round";
		g.lineCap = "round";
		return g;
	};
	const tones = layer();
	const ink = layer();
	draw(luliKit(tones, ink, night ? WHITE : BLACK, lineWidth));
	const result = document.createElement("canvas");
	result.width = W;
	result.height = H;
	const g = result.getContext("2d");
	g.drawImage(oneBitLayer(tones.canvas, "bayer"), 0, 0);
	g.drawImage(oneBitLayer(ink.canvas, "threshold"), 0, 0);
	return result;
}

// ---------------------------------------------------------------------------------------------------------
// Decorations, in Luli's style (outlines, tones in dots): flowers, leaves, the ✨ twinkles, and spaces for
// photos. Each draws with a kit in frame coordinates; frames use them through p.decor((kit) => …), or
// p.photo(…) for a photo space with its label.
// ---------------------------------------------------------------------------------------------------------

function circlePath(x, y, r) {
	return ellipsePath(x, y, r, r);
}

/** A four-pointed star; `fat` is how full its sides are (0: thin spikes). */
function starPath(x, y, r, fat = 0.32) {
	const k = r * fat;
	return pathOf((path) => {
		path.moveTo(x, y - r);
		path.quadraticCurveTo(x + k, y - k, x + r, y);
		path.quadraticCurveTo(x + k, y + k, x, y + r);
		path.quadraticCurveTo(x - k, y + k, x - r, y);
		path.quadraticCurveTo(x - k, y - k, x, y - r);
		path.closePath();
	});
}

/** The ✨: a big twinkle, outlined, with two small solid ones up and down to its left. */
function drawTwinkles(kit, x, y, size) {
	kit.part(starPath(x, y, size), 1);
	kit.solid(starPath(x - size * 1.05, y - size * 0.8, size * 0.42), kit.lineColor);
	kit.solid(starPath(x - size * 0.8, y + size * 0.85, size * 0.3), kit.lineColor);
}

/** A leaf from (x, y), `length` long, pointing `angle` radians clockwise from the right. */
function drawLeaf(kit, x, y, length, angle, tone = 0.5) {
	kit.at(x, y, angle, () => {
		kit.part(pathOf((path) => {
			path.moveTo(0, 0);
			path.quadraticCurveTo(length * 0.5, -length * 0.36, length, 0);
			path.quadraticCurveTo(length * 0.5, length * 0.36, 0, 0);
			path.closePath();
		}), tone);
		kit.stroke(pathOf((path) => {
			path.moveTo(length * 0.12, 0);
			path.lineTo(length * 0.72, 0);
		}), kit.lineWidth * 0.6);
	});
}

function drawStem(kit, x1, y1, x2, y2, bend = 0) {
	kit.stroke(pathOf((path) => {
		path.moveTo(x1, y1);
		path.quadraticCurveTo((x1 + x2) / 2 + bend, (y1 + y2) / 2, x2, y2);
	}));
}

function drawDaisy(kit, x, y, r, angle = 0) {
	const petals = 11;
	for (let i = 0; i < petals; i++) {
		const a = angle + (i / petals) * Math.PI * 2;
		kit.part(ellipsePath(x + Math.cos(a) * r * 0.56, y + Math.sin(a) * r * 0.56, r * 0.46, r * 0.19, a), 1);
	}
	kit.part(circlePath(x, y, r * 0.3), 0.32);
}

function drawBlossom(kit, x, y, r, angle = 0) {
	for (let i = 0; i < 5; i++) {
		const a = angle - Math.PI / 2 + (i / 5) * Math.PI * 2;
		kit.part(circlePath(x + Math.cos(a) * r * 0.52, y + Math.sin(a) * r * 0.52, r * 0.5), 0.72);
	}
	kit.part(circlePath(x, y, r * 0.26), 1);
}

function drawRose(kit, x, y, r, angle = 0) {
	kit.part(circlePath(x, y, r), 0.6);
	kit.at(x, y, angle, () => {
		kit.stroke(pathOf((path) => {
			// The bud in the middle, curled.
			path.moveTo(-r * 0.22, -r * 0.05);
			path.quadraticCurveTo(-r * 0.2, -r * 0.34, r * 0.08, -r * 0.3);
			path.quadraticCurveTo(r * 0.34, -r * 0.22, r * 0.26, r * 0.06);
			path.quadraticCurveTo(r * 0.12, r * 0.26, -r * 0.12, r * 0.12);
			// The petals around it.
			path.moveTo(-r * 0.64, -r * 0.18);
			path.quadraticCurveTo(-r * 0.56, r * 0.52, r * 0.12, r * 0.56);
			path.moveTo(r * 0.64, -r * 0.3);
			path.quadraticCurveTo(r * 0.66, r * 0.32, r * 0.26, r * 0.52);
			path.moveTo(-r * 0.5, -r * 0.56);
			path.quadraticCurveTo(-r * 0.04, -r * 0.82, r * 0.5, -r * 0.56);
		}), kit.lineWidth * 0.8);
	});
}

function drawTulip(kit, x, y, r, angle = 0) {
	kit.at(x, y, angle, () => {
		kit.part(pathOf((path) => {
			path.moveTo(-r * 0.78, -r * 0.6);
			path.quadraticCurveTo(-r * 0.95, r * 0.7, 0, r * 0.78);
			path.quadraticCurveTo(r * 0.95, r * 0.7, r * 0.78, -r * 0.6);
			path.lineTo(r * 0.4, -r * 0.2);
			path.lineTo(0, -r * 0.7);
			path.lineTo(-r * 0.4, -r * 0.2);
			path.closePath();
		}), 0.52);
		kit.part(pathOf((path) => {
			path.moveTo(-r * 0.42, -r * 0.1);
			path.quadraticCurveTo(0, -r * 0.95, r * 0.42, -r * 0.1);
			path.quadraticCurveTo(r * 0.45, r * 0.62, 0, r * 0.74);
			path.quadraticCurveTo(-r * 0.45, r * 0.62, -r * 0.42, -r * 0.1);
			path.closePath();
		}), 0.72);
	});
}

function drawBud(kit, x, y, r, angle = 0) {
	kit.at(x, y, angle, () => {
		kit.part(ellipsePath(0, 0, r * 0.7, r), 0.62);
		kit.stroke(pathOf((path) => {
			path.moveTo(-r * 0.7, r * 0.5);
			path.lineTo(0, r * 1.1);
			path.lineTo(r * 0.7, r * 0.5);
		}), kit.lineWidth * 0.8);
	});
}

const FLOWERS = { daisy: drawDaisy, blossom: drawBlossom, rose: drawRose, tulip: drawTulip, bud: drawBud };

/** A flower ("daisy", "blossom", "rose", "tulip" or "bud") of radius r at (x, y). */
function drawFlower(kit, kind, x, y, r, angle = 0) {
	FLOWERS[kind](kit, x, y, r, angle);
}

/** A bunch of flowers and leaves in a corner of the frame: "top-left", "top-right", "bottom-left" or "bottom-right". */
function drawCornerBunch(kit, corner, size = 1) {
	const [x, y, angle, flip] = {
		"top-left": [0, 0, 0, false],
		"top-right": [W, 0, 0, true],
		"bottom-left": [0, H, Math.PI, true],
		"bottom-right": [W, H, Math.PI, false],
	}[corner];
	kit.at(x, y, angle, () => {
		const s = size;
		drawLeaf(kit, 8 * s, 30 * s, 110 * s, 0.3);
		drawLeaf(kit, 30 * s, 8 * s, 110 * s, 1.25);
		drawLeaf(kit, 20 * s, 20 * s, 150 * s, 0.78);
		drawLeaf(kit, 120 * s, 40 * s, 70 * s, 0.1, 0.6);
		drawRose(kit, 62 * s, 58 * s, 40 * s);
		drawDaisy(kit, 142 * s, 34 * s, 34 * s, 0.2);
		drawBlossom(kit, 40 * s, 132 * s, 30 * s, 0.3);
		drawBud(kit, 186 * s, 82 * s, 11 * s, -0.9);
		drawBud(kit, 98 * s, 116 * s, 10 * s, -0.6);
	}, flip);
}

/** A vine from (x1, y1) to (x2, y2): a wavy stem with leaves on both sides and small flowers along it. */
function drawVine(kit, x1, y1, x2, y2, { wave = 7, leafEvery = 44, flowerEvery = 150 } = {}) {
	const length = Math.hypot(x2 - x1, y2 - y1);
	const waveAt = (x) => Math.sin(x / 34) * wave;
	kit.at(x1, y1, Math.atan2(y2 - y1, x2 - x1), () => {
		kit.stroke(pathOf((path) => {
			for (let x = 0; x <= length; x += 4) path.lineTo(x, waveAt(x));
		}));
		for (let i = 0, x = leafEvery / 2; x < length - 8; i++, x += leafEvery) {
			const side = i % 2 ? 1 : -1;
			drawLeaf(kit, x, waveAt(x), 26, side * 0.9 - 0.25);
		}
		const kinds = ["blossom", "bud", "daisy", "bud"];
		for (let i = 0, x = flowerEvery / 2; x < length - 20; i++, x += flowerEvery) {
			drawFlower(kit, kinds[i % kinds.length], x, waveAt(x), kinds[i % kinds.length] === "bud" ? 10 : 16, 0.3);
		}
	});
}

/** A point on a heart curve, about 32 wide and 29 tall, for t from 0 to 2π. */
function heartPoint(t) {
	return [16 * Math.sin(t) ** 3, -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))];
}

/** A heart of leaves and flowers around (x, y): a stem along a heart curve, `scale` px per unit of the curve (about 370 px wide at 11.5). */
function drawHeartWreath(kit, x, y, scale) {
	const point = (t) => {
		const [hx, hy] = heartPoint(t);
		return [x + hx * scale, y + hy * scale];
	};
	kit.stroke(pathOf((path) => {
		for (let i = 0; i <= 160; i++) path.lineTo(...point((i / 160) * Math.PI * 2));
	}));
	const count = 36;
	const at = (i) => point((i / count) * Math.PI * 2);
	for (let i = 0; i < count; i++) {
		const [px, py] = at(i + 0.5);
		const [nx, ny] = at(i + 1);
		drawLeaf(kit, px, py, 28, Math.atan2(ny - py, nx - px) + (i % 2 ? 0.75 : -0.75));
	}
	// Flowers every third point, none at the dip on top (where the text goes).
	const kinds = ["rose", "daisy", "blossom", "bud", "daisy", "rose", "blossom", "bud", "daisy", "blossom", "rose", "bud"];
	for (let i = 1, k = 0; i < count; i += 3, k++) {
		const [px, py] = at(i + 0.5);
		const kind = kinds[k % kinds.length];
		drawFlower(kit, kind, px, py, kind === "bud" ? 11 : kind === "rose" ? 20 : 22, i * 0.4);
	}
}

/** A bouquet in a paper cone tied with a bow, the tip of the cone at (x, y). */
function drawBouquet(kit, x, y, size = 1) {
	kit.at(x, y, 0, () => {
		const s = size;
		const heads = [
			["tulip", -88, -250, 30, -0.35], ["rose", -42, -292, 38, 0], ["daisy", 40, -310, 40, 0.2],
			["tulip", 6, -360, 30, 0.08], ["blossom", 92, -250, 32, 0.4], ["bud", -110, -320, 12, -0.5], ["bud", 110, -322, 12, 0.5],
		];
		for (const [, hx, hy] of heads) drawStem(kit, 0, -150 * s, hx * s, hy * s, hx * 0.2 * s);
		drawLeaf(kit, -20 * s, -200 * s, 90 * s, -2.5);
		drawLeaf(kit, 20 * s, -200 * s, 90 * s, -0.6);
		drawLeaf(kit, -10 * s, -230 * s, 70 * s, -1.9, 0.6);
		for (const [kind, hx, hy, r, angle] of heads) drawFlower(kit, kind, hx * s, hy * s, r * s, angle);
		kit.part(pathOf((path) => {
			path.moveTo(-100 * s, -190 * s);
			path.lineTo(100 * s, -190 * s);
			path.lineTo(0, 0);
			path.closePath();
		}), 0.86);
		kit.stroke(pathOf((path) => {
			path.moveTo(-50 * s, -190 * s);
			path.lineTo(-8 * s, -20 * s);
			path.moveTo(40 * s, -190 * s);
			path.lineTo(10 * s, -40 * s);
		}), kit.lineWidth * 0.7);
		// A bow tied round the top of the cone.
		for (const side of SIDES) kit.at(side * 10 * s, -160 * s, side * -0.35, () => kit.part(rectPath(-6 * s, 0, 12 * s, 46 * s, 6 * s), 0.3));
		for (const side of SIDES) kit.part(ellipsePath(side * 32 * s, -168 * s, 32 * s, 15 * s, side * 0.3), 0.3);
		kit.part(circlePath(0, -166 * s, 12 * s), 0.3);
	});
}

/** A space for a photo: lightly dotted, with a dashed border and a camera. The photo goes on top of it. */
function drawPhotoSpot(kit, x, y, w, h) {
	kit.part(rectPath(x, y, w, h), 0.88, false);
	kit.dashed(rectPath(x + 4, y + 4, w - 8, h - 8), 3);
	const cx = x + w / 2;
	const cy = y + h / 2 - 22;
	kit.part(rectPath(cx - 14, cy - 34, 28, 14, 3), 1);
	kit.part(rectPath(cx - 38, cy - 26, 76, 52, 9), 1);
	kit.part(circlePath(cx, cy, 16), 0.88);
	kit.part(circlePath(cx, cy, 7), 1);
}

/** A polaroid around a photo space w × h at (x, y): a white card with a wide bottom, and its shadow. */
function drawPolaroid(kit, x, y, w, h, bottom) {
	const pad = 16;
	kit.part(rectPath(x - pad + 10, y - pad + 12, w + pad * 2, h + pad + bottom), 0.45, false);
	kit.part(rectPath(x - pad, y - pad, w + pad * 2, h + pad + bottom, 4), 1);
	drawPhotoSpot(kit, x, y, w, h);
}

// ---------------------------------------------------------------------------------------------------------
// The painter: what the frames draw with. Everything is drawn smooth on the canvas, then made 1 bit.
// ---------------------------------------------------------------------------------------------------------

function painter(g, options) {
	const tile = (rows) => {
		const canvas = document.createElement("canvas");
		canvas.width = rows[0].length;
		canvas.height = rows.length;
		const tileContext = canvas.getContext("2d");
		tileContext.fillStyle = WHITE;
		tileContext.fillRect(0, 0, canvas.width, canvas.height);
		tileContext.fillStyle = BLACK;
		rows.forEach((row, y) => [...row].forEach((bit, x) => bit === "1" && tileContext.fillRect(x, y, 1, 1)));
		return g.createPattern(canvas, "repeat");
	};
	const dots = { half: tile(["10", "01"]), light: tile(["10", "00"]), dark: tile(["11", "10"]) };
	// Luli was brown: half dots, with darker (black) ears.
	const coat = { o: dots.half, e: BLACK };

	const shape = (color, draw) => {
		g.fillStyle = color;
		g.beginPath();
		draw();
		g.fill();
	};

	const p = {
		her: options.her.trim() || "meu amor",
		dots,

		fill(color) {
			g.fillStyle = color;
			g.fillRect(0, 0, W, H);
		},
		rect(x, y, width, height, color = BLACK) {
			g.fillStyle = color;
			g.fillRect(x, y, width, height);
		},
		frameRect(x, y, width, height, lineWidth, color = BLACK) {
			g.strokeStyle = color;
			g.lineWidth = lineWidth;
			g.strokeRect(x + lineWidth / 2, y + lineWidth / 2, width - lineWidth, height - lineWidth);
		},
		circle(x, y, r, color = BLACK) {
			shape(color, () => g.arc(x, y, r, 0, Math.PI * 2));
		},
		ring(x, y, r, lineWidth, color = BLACK) {
			g.strokeStyle = color;
			g.lineWidth = lineWidth;
			g.beginPath();
			g.arc(x, y, r, 0, Math.PI * 2);
			g.stroke();
		},
		line(x1, y1, x2, y2, lineWidth, color = BLACK) {
			g.strokeStyle = color;
			g.lineWidth = lineWidth;
			g.lineCap = "round";
			g.beginPath();
			g.moveTo(x1, y1);
			g.lineTo(x2, y2);
			g.stroke();
		},

		/**
		 * Text in the editor's font, at 24, 40 or 64 px, wrapped to `width`. `x` is the middle of the lines,
		 * or their left or right edge, as `align` says; `y` is the top of the first line. Returns the bottom
		 * of the last line.
		 */
		text(words, { x = W / 2, y, size = 40, align = "center", width = 720, color = BLACK }) {
			g.font = `700 ${size}px ${FONT}`;
			g.fillStyle = color;
			const measure = (line) => g.measureText(line).width;
			const step = Math.round(size * 1.3);
			const lines = wrap(words, width, measure);
			lines.forEach((line, index) => {
				const lineWidth = measure(line);
				const left = align === "center" ? x - Math.floor(lineWidth / 2) : align === "right" ? x - Math.ceil(lineWidth) : x;
				g.fillText(line, Math.round(left), y + size + index * step);
			});
			return y + lines.length * step;
		},

		/**
		 * Sprite layers drawn `scale` px per cell, with the middle of their solid cells at `cx` and their
		 * bottom at `bottom`. `line` is the outline's color, `coat` the dog's colors.
		 */
		sprite(layers, { cx, bottom, scale, flip = false, line = BLACK, halo = line, coat = null }) {
			let cells = outline(compose(typeof layers[0] === "string" ? [{ rows: layers }] : layers));
			if (flip) {
				cells = mirror(cells);
			}
			let minX = Infinity, maxX = -Infinity, maxY = -Infinity;
			cells.forEach((row, y) => row.forEach((cell, x) => {
				if (cell !== "." && cell !== "a") {
					minX = Math.min(minX, x);
					maxX = Math.max(maxX, x);
					maxY = Math.max(maxY, y);
				}
			}));
			const left = Math.round(cx - ((minX + maxX + 1) * scale) / 2);
			const top = Math.round(bottom - (maxY + 1) * scale);
			const colors = {
				o: coat?.o ?? WHITE, e: coat?.e ?? BLACK, n: BLACK, "#": BLACK, w: WHITE, W: WHITE,
				d: dots.half, l: dots.light, h: line, a: halo, L: line,
			};
			cells.forEach((row, y) => row.forEach((cell, x) => {
				if (cell !== ".") {
					g.fillStyle = colors[cell];
					g.fillRect(left + x * scale, top + y * scale, scale, scale);
				}
			}));
		},

		/** The pixel dog, in a pose (`standing` or `sleeping`), with her halo if the page asks for it. */
		dog(pose, { glasses = false, happy = false, line = BLACK, haloColor = line, ...place }) {
			const dog = DOG[pose];
			const layers = [{ rows: dog.rows }];
			if (glasses) layers.push({ rows: GLASSES, x: dog.glasses[0], y: dog.glasses[1] });
			if (happy) layers.push({ rows: HAPPY, x: dog.happy[0], y: dog.happy[1] });
			if (options.halo) layers.push({ rows: HALO, x: dog.halo[0], y: dog.halo[1] });
			p.sprite(layers, { ...place, line, halo: haloColor, coat });
		},

		/** Luli in a pose, with options: see LULI_POSES. */
		luli(pose = "peek", place = {}) {
			g.drawImage(drawLuli(pose, { halo: options.halo, ...place }), 0, 0);
		},
		/** Decorations drawn with a kit in frame coordinates (drawFlower, drawTwinkles, …); white lines at `night`. */
		decor(draw, { night = false } = {}) {
			g.drawImage(renderKit(draw, { night, lineWidth: 4 }), 0, 0);
		},
		/**
		 * A space for a photo, w × h at (x, y), labelled with its size: in the editor, add the photo over it
		 * and fit it to the space. With `polaroid`, a card around it with a bottom that tall, for a caption.
		 */
		photo(x, y, w, h, { polaroid = 0 } = {}) {
			p.decor((kit) => (polaroid ? drawPolaroid(kit, x, y, w, h, polaroid) : drawPhotoSpot(kit, x, y, w, h)));
			p.text("sua foto aqui", { x: x + w / 2, y: y + h / 2 + 14, size: 24, width: w });
			p.text(`${w} × ${h}`, { x: x + w / 2, y: y + h / 2 + 44, size: 24, width: w });
		},
		textWidth(words, size) {
			g.font = `700 ${size}px ${FONT}`;
			return g.measureText(words).width;
		},

		/** A cloud on a flat bottom, `width` wide, with its middle at `cx`. */
		cloud(cx, bottom, width, { fill = WHITE, line = BLACK, lineWidth = 5 } = {}) {
			const puffs = [[-0.33, -0.16, 0.16], [-0.13, -0.27, 0.2], [0.12, -0.29, 0.22], [0.33, -0.17, 0.16]];
			const draw = (color, grow) => {
				for (const [dx, dy, r] of puffs) p.circle(cx + dx * width, bottom + dy * width, r * width + grow, color);
				p.rect(cx - 0.33 * width - grow, bottom - 0.2 * width - grow, 0.66 * width + 2 * grow, 0.2 * width + 2 * grow, color);
			};
			draw(line, lineWidth);
			draw(fill, 0);
		},
		/** A sun; a `rising` one has rays only above the horizon at `y`. */
		sun(x, y, r, { color = BLACK, rays = 12, bg = WHITE, rising = false } = {}) {
			for (let i = rising ? 1 : 0; i < rays; i++) {
				const angle = rising ? Math.PI + (i / rays) * Math.PI : (i / rays) * Math.PI * 2;
				p.line(x + Math.cos(angle) * (r + 14), y + Math.sin(angle) * (r + 14), x + Math.cos(angle) * (r + 38), y + Math.sin(angle) * (r + 38), 7, color);
			}
			p.circle(x, y, r, color);
			p.circle(x, y, r - 7, bg === WHITE ? dots.light : bg);
		},
		moon(x, y, r, color = WHITE, bg = BLACK) {
			p.circle(x, y, r, color);
			p.circle(x + r * 0.45, y - r * 0.3, r * 0.82, bg);
		},
		/** A four-pointed twinkle. */
		sparkle(x, y, r, color = BLACK) {
			const k = r * 0.16;
			shape(color, () => {
				g.moveTo(x, y - r);
				g.quadraticCurveTo(x + k, y - k, x + r, y);
				g.quadraticCurveTo(x + k, y + k, x, y + r);
				g.quadraticCurveTo(x - k, y + k, x - r, y);
				g.quadraticCurveTo(x - k, y - k, x, y - r);
			});
		},
		star(x, y, r, color = BLACK) {
			shape(color, () => {
				for (let i = 0; i < 10; i++) {
					const angle = -Math.PI / 2 + (i * Math.PI) / 5;
					const radius = i % 2 === 0 ? r : r * 0.45;
					g.lineTo(x + Math.cos(angle) * radius, y + Math.sin(angle) * radius);
				}
			});
		},
		heart(x, y, width, color = BLACK) {
			g.fillStyle = color;
			g.fill(heartPath(x, y, width));
		},
		heartOutline(x, y, width, lineWidth, color = BLACK, bg = WHITE) {
			p.heart(x, y, width, color);
			p.heart(x, y + lineWidth * 0.3, width - lineWidth * 2.6, bg);
		},
		/** A paw print, its toes pointing `angle` radians clockwise from up. */
		paw(x, y, size, angle = 0, color = BLACK) {
			g.save();
			g.translate(x, y);
			g.rotate(angle);
			shape(color, () => g.ellipse(0, size * 0.2, size * 0.3, size * 0.24, 0, 0, Math.PI * 2));
			for (const [dx, dy] of [[-0.38, -0.12], [-0.14, -0.36], [0.14, -0.36], [0.38, -0.12]]) {
				shape(color, () => g.ellipse(dx * size, dy * size, size * 0.13, size * 0.17, dx * 0.9, 0, Math.PI * 2));
			}
			g.restore();
		},
		firework(x, y, r, color = BLACK) {
			for (let i = 0; i < 14; i++) {
				const angle = (i / 14) * Math.PI * 2;
				const cos = Math.cos(angle), sin = Math.sin(angle);
				p.line(x + cos * r * 0.3, y + sin * r * 0.3, x + cos * r * 0.85, y + sin * r * 0.85, 4, color);
				p.circle(x + cos * r, y + sin * r, 4, color);
			}
		},
		snowflake(x, y, r, color = BLACK) {
			for (let i = 0; i < 3; i++) {
				const angle = (i * Math.PI) / 3;
				const cos = Math.cos(angle), sin = Math.sin(angle);
				p.line(x - cos * r, y - sin * r, x + cos * r, y + sin * r, 4, color);
				for (const end of [-1, 1]) {
					const bx = x + cos * r * 0.55 * end, by = y + sin * r * 0.55 * end;
					for (const turn of [-0.7, 0.7]) {
						const branch = angle + (end < 0 ? Math.PI : 0) + turn * 1.0;
						p.line(bx, by, bx + Math.cos(branch) * r * 0.32, by + Math.sin(branch) * r * 0.32, 3, color);
					}
				}
			}
		},
		/** "Z z" rising to the right from (x, y). */
		zzz(x, y, color = BLACK) {
			p.text("Z", { x, y, size: 24, align: "left", color });
			p.text("Z", { x: x + 24, y: y - 44, size: 40, align: "left", color });
		},
		/** Party bunting (bandeirinhas): two strings across the top, flags solid and dotted in turn. */
		bunting({ y = 6, sag = 34, size = 30, color = BLACK } = {}) {
			for (const [from, to] of [[-10, W / 2], [W / 2, W + 10]]) {
				const at = (t) => [from + (to - from) * t, y + sag * 4 * t * (1 - t)];
				g.strokeStyle = color;
				g.lineWidth = 3;
				g.beginPath();
				for (let t = 0; t <= 1; t += 0.02) g.lineTo(...at(t));
				g.stroke();
				const flags = 7;
				for (let i = 0; i < flags; i++) {
					const [x, top] = at((i + 0.5) / flags);
					const fill = i % 2 ? dots.half : color;
					shape(color, () => {
						g.moveTo(x - size / 2 - 3, top - 2);
						g.lineTo(x + size / 2 + 3, top - 2);
						g.lineTo(x, top + size * 1.1 + 4);
					});
					shape(fill, () => {
						g.moveTo(x - size / 2 + 2, top + 1);
						g.lineTo(x + size / 2 - 2, top + 1);
						g.lineTo(x, top + size * 1.1 - 3);
					});
				}
			}
		},
		/** A dog bed drawn in outline, `width` wide, its middle at `cx`. */
		bed(cx, bottom, width, height, color = BLACK) {
			g.strokeStyle = color;
			g.lineWidth = 5;
			g.beginPath();
			g.roundRect(cx - width / 2, bottom - height, width, height, height / 2);
			g.stroke();
			g.lineWidth = 3;
			g.beginPath();
			g.roundRect(cx - width / 2 + 16, bottom - height + 14, width - 32, height - 22, height / 2 - 12);
			g.stroke();
		},
		ground(y, color = BLACK) {
			p.rect(40, y, W - 80, 4, color);
		},
	};
	return p;
}

/** Every pixel to pure black or white, at 50 %. */
function oneBit(g) {
	const image = g.getImageData(0, 0, W, H);
	const data = image.data;
	for (let i = 0; i < data.length; i += 4) {
		const value = data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114 < 128 ? 0 : 255;
		data[i] = data[i + 1] = data[i + 2] = value;
		data[i + 3] = 255;
	}
	g.putImageData(image, 0, 0);
}

// ---------------------------------------------------------------------------------------------------------
// The page.
// ---------------------------------------------------------------------------------------------------------

const controls = {
	her: document.getElementById("her"),
	halo: document.getElementById("halo"),
	paper: document.getElementById("paper"),
	actual: document.getElementById("actual"),
};
const STORAGE = "inkpost-frame-ideas";
const cards = [];
let kind = "all";

function restore() {
	const saved = JSON.parse(localStorage.getItem(STORAGE) ?? "{}");
	for (const [name, control] of Object.entries(controls)) {
		if (name in saved) control[control.type === "checkbox" ? "checked" : "value"] = saved[name];
	}
}

function save() {
	const values = Object.fromEntries(Object.entries(controls).map(([name, control]) => [name, control.type === "checkbox" ? control.checked : control.value]));
	localStorage.setItem(STORAGE, JSON.stringify(values));
}

function render(frame, canvas) {
	const g = canvas.getContext("2d", { willReadFrequently: true });
	g.fillStyle = WHITE;
	g.fillRect(0, 0, W, H);
	frame.draw(painter(g, { her: controls.her.value, halo: controls.halo.checked }));
	oneBit(g);
}

function renderAll() {
	for (const { frame, canvas } of cards) render(frame, canvas);
}

function filter() {
	for (const { frame, card } of cards) card.hidden = kind !== "all" && frame.kind !== kind;
	for (const button of document.querySelectorAll("#filters button")) button.setAttribute("aria-pressed", String(button.dataset.kind === kind));
}

function build() {
	const filters = document.getElementById("filters");
	for (const [value, label] of [["all", "All"], ...KINDS]) {
		const button = document.createElement("button");
		button.type = "button";
		button.dataset.kind = value;
		button.textContent = label;
		button.addEventListener("click", () => {
			kind = value;
			filter();
		});
		filters.append(button);
	}

	const template = document.getElementById("card-template");
	const grid = document.getElementById("grid");
	const zoom = document.getElementById("zoom");
	for (const frame of FRAMES) {
		const card = template.content.firstElementChild.cloneNode(true);
		const canvas = card.querySelector("canvas");
		card.querySelector("h2").textContent = frame.title;
		const when = card.querySelector(".when");
		when.textContent = frame.code ?? frame.when;
		when.classList.toggle("code", Boolean(frame.code));
		canvas.setAttribute("aria-label", frame.title);
		canvas.addEventListener("click", () => {
			zoom.querySelector("canvas").getContext("2d").drawImage(canvas, 0, 0);
			zoom.showModal();
		});
		card.querySelector("button").addEventListener("click", () => {
			canvas.toBlob((blob) => {
				const link = document.createElement("a");
				link.href = URL.createObjectURL(blob);
				link.download = `inkpost-${frame.id}.png`;
				link.click();
				URL.revokeObjectURL(link.href);
			}, "image/png");
		});
		grid.append(card);
		cards.push({ frame, card, canvas });
	}
	zoom.addEventListener("click", () => zoom.close());
}

function applyView() {
	document.body.classList.toggle("paper", controls.paper.checked);
	document.body.classList.toggle("actual", controls.actual.checked);
}

let pending = 0;
document.getElementById("controls").addEventListener("input", () => {
	save();
	applyView();
	cancelAnimationFrame(pending);
	pending = requestAnimationFrame(renderAll);
});
document.getElementById("controls").addEventListener("submit", (event) => event.preventDefault());

restore();
build();
filter();
applyView();
// The font's @font-face is at the end of the page: wait until it's read.
document.addEventListener("DOMContentLoaded", () => document.fonts.load(`700 40px ${FONT}`).then(renderAll));
</script>
