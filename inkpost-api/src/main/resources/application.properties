spring.application.name=inkpost-api
springdoc.show-actuator=true

# SQLite database file (D40); the INKPOST_DB_PATH environment variable overrides it.
inkpost.db-path=inkpost.db
# Foreign keys are off by default in SQLite.
spring.datasource.url=jdbc:sqlite:${inkpost.db-path}?foreign_keys=true
# SQLite allows one writer at a time, and there is one user.
spring.datasource.hikari.maximum-pool-size=1
# The schema comes only from Flyway migrations (src/main/resources/db/migration).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Brasília (D27). Every "now" comes from the Clock bean, in this zone.
inkpost.timezone=America/Sao_Paulo
# A frame upload is an 800x480 PNG of black and white pixels: a few KB (D41).
spring.servlet.multipart.max-file-size=2MB
