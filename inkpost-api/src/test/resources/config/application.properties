# Test overrides: classpath:config/application.properties wins over classpath:application.properties.

# Each test context gets its own empty in-memory database, migrated by Flyway.
# It lives as long as its connection, which the pool of 1 keeps open.
spring.datasource.url=jdbc:sqlite::memory:?foreign_keys=true

# A device key for when INKPOST_DEVICE_KEY isn't set; the environment variable wins over this file,
# so the tests send whichever key is configured.
inkpost.device-key=test-device-key
